<!DOCTYPE html>
<html lang="en"
 xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Space</title>



    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.min.js}"></script>
</head>
<body>
<header>

        <nav id="nav-container">

            <a  th:if="${currentPage != 'home'}" th:href="@{home}" class="nav-button">Home</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{register}" class="nav-button">Register</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{login}" class="nav-button">Login</a>
            <a th:if="${currentPage != 'maintenance'}" th:href="@{/maintenance}" class="nav-button">Maintenance</a>
            <a th:if="${currentPage != 'design'}" th:href="@{design}" class="nav-button">Design</a>
            <a  th:if="${currentPage != 'contact'}" th:href="@{contact}" class="nav-button">Contact Us</a>
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{manager}" class="nav-button">Manager</a>

            <a  th:if="${currentPage != 'client'}" sec:authorize="hasRole('CLIENT')"
               th:href="@{client}" class="nav-button">Profile</a>

            <a  sec:authorize="isAuthenticated()"
                th:href="@{logout}" class="nav-button">Logout</a>


            <div sec:authorize="isAuthenticated()" class="user-welcome">
                <span class="welcome-text">
                    Welcome, <strong sec:authentication="name"></strong>

                </span>
            </div>

        </nav>
</header>

</body>
</html>
