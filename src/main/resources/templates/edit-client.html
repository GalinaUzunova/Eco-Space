<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/commons::head}">
    <title>Client Management</title>
    <link rel="stylesheet" th:href="@{/css/manager.css}">
</head>
<body>
<div id="main-container">
    <header id="main-header">
        <h1 id="main-title">Client Management</h1>
        <nav id="nav-container" th:replace="~{fragments/admin::nav}">


        </nav>

    </header>

    <div class="content-section">

        <h2 class="section-title">All Clients</h2>

        <div class="project-category">
            <table class="project-table">
                <thead>
                <tr>
                    <th>Client id</th>
                    <th>Client Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Registration Date</th>
                    <th>Change Role</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="client : ${clients}">
                    <td th:text="${client.id}"></td>
                    <td th:text="${client.username}"></td>
                    <td th:text="${client.email}"></td>
                    <td>
                            <span
                                    th:text="${client.role}">Active</span>
                    </td>
                    <td th:text="${#temporals.format(client.createdOn, 'dd/MM/yyyy')}">01/01/2024</td>
                    <td>
                        <form th:action="@{/edit-client/update/{id}(id=${client.id})}" th:method="POST" style="display: inline;">
                            <button type="submit" class="status-button">Switch Role</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>


        <div class="packages-container" style="margin-top: 30px;">
            <div class="package package-basic">
                <div class="package-header">Total Clients</div>
                <div class="package-price" th:text="${clients.size()!= null ? clients.size(): clients.size()}"></div>
                <div class="package-features">
                    <ul>
<!--                        <li>Active: <span th:text="${activeClients != null ? activeClients : '120'}">120</span></li>-->
<!--                        <li>Inactive: <span th:text="${inactiveClients != null ? inactiveClients : '20'}">20</span></li>-->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <footer id="main-footer">
        <p>© 2025 EcoSpace. All rights reserved.</p>
    </footer>
</div>
</body>
</html>
