spring:
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/eco-space?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: '1234'
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: gbuzunova13@gmail.com
    password: your-app-password
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000

  # Task Scheduling
  task:
    scheduling:
      pool:
        size: 5

  # Spring MVC
  mvc:
    hiddenmethod:
      filter:
        enabled: true

  # Security (basic auth)
  security:
    user:
      name: user
      password: '123'

# Server Configuration
server:
  port: 8084

# Logging
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.ecospace: DEBUG

# Custom Application Properties
app:
  email:
    from: your-email@gmail.com
    company-name: "Eco-Space"
  subscription:
    expiry-notification-days: 7
    cron-expression: "0 0 9 * * ?"