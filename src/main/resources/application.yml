spring:

  datasource:
    url: jdbc:mysql://localhost:3306/eco-space?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: '1234'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false


  task:
    scheduling:
      pool:
        size: 5


  mvc:
    hiddenmethod:
      filter:
        enabled: true


  security:
    user:
      name: user
      password: '123'


server:
  port: 8084

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 15000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.ecospace: DEBUG





#  Custom Application Properties
app:
  email:
    from: your-email@gmail.com
    company-name: "Eco-Space"
  subscription:
    expiry-notification-days: 7
    cron-expression: "0 0 9 * * ?"